name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both architectures, since behavior can differ between them (e.g. floating-point to
    # integer conversion) - each runner builds and tests natively for its own CPU.
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ReadyCode.slnf

      # Warnings fail the build here (not locally), so the zero-warning baseline - including the
      # .editorconfig rules enforced in builds, like unused usings - can't erode unnoticed.
      - name: Build
        run: dotnet build ReadyCode.slnf -c Debug --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test ReadyCode.Tests/ReadyCode.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ReadyCode.Tests/TestResults/*.trx
