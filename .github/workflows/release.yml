name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Accept WiX OSMF EULA
        shell: pwsh
        run: |
          New-Item -Path "$env:USERPROFILE\.wix" -ItemType Directory -Force
          New-Item -Path "$env:USERPROFILE\.wix\wix7-osmf-eula.txt" -ItemType File -Force

      # ReadyCode.csproj declares RuntimeIdentifiers (win-x64;win-arm64), so one restore covers both
      - name: Restore dependencies
        run: dotnet restore READYCode.sln

      # Don't publish a release whose tests fail (ARM64 is covered by the Build and Test workflow)
      - name: Test
        run: dotnet test ReadyCode.Tests/ReadyCode.Tests.csproj -c Debug --no-restore

      - name: Build app
        run: |
          dotnet build ReadyCode/ReadyCode.csproj -c Release -r win-x64 --no-restore
          dotnet build ReadyCode/ReadyCode.csproj -c Release -r win-arm64 --no-restore

      - name: Build installers
        run: |
          dotnet build ReadyCode.Installer/ReadyCode.Installer.wixproj -c Release -p:Platform=x64 --no-restore
          dotnet build ReadyCode.Installer/ReadyCode.Installer.wixproj -c Release -p:Platform=ARM64 --no-restore

      - name: Read Changelog
        id: changelog
        shell: pwsh
        run: |
          $content = Get-Content -Path "./CHANGELOG.md" -Raw

          # Extract text between the first ## heading and the second ## heading
          $match = [regex]::Match($content, '(?s)(## \[.*?)(?=\n## \[|\z)')
          $section = $match.Groups[1].Value.Trim()

          "CHANGELOG<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $section | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ReadyCode.Installer/bin/*/Release/en-US/*.msi
          body: ${{ steps.changelog.outputs.CHANGELOG }}