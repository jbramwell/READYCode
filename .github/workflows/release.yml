name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The pushed tag (e.g. v2.5.0) must match ReadyCodeVersion in Directory.Build.props, so a
      # release can't ship binaries stamped with a different version than its name.
      - name: Check tag matches version
        shell: pwsh
        run: |
          $version = dotnet msbuild ReadyCode/ReadyCode.csproj -getProperty:ReadyCodeVersion
          if ("v$version" -ne '${{ github.ref_name }}') {
            Write-Error "Tag ${{ github.ref_name }} doesn't match ReadyCodeVersion $version in Directory.Build.props."
            exit 1
          }

      - name: Accept WiX OSMF EULA
        shell: pwsh
        run: |
          New-Item -Path "$env:USERPROFILE\.wix" -ItemType Directory -Force
          New-Item -Path "$env:USERPROFILE\.wix\wix7-osmf-eula.txt" -ItemType File -Force

      # ReadyCode.csproj declares RuntimeIdentifiers (win-x64;win-arm64), so one restore covers both
      - name: Restore dependencies
        run: dotnet restore READYCode.sln

      # Don't publish a release whose tests fail (ARM64 is covered by the Build and Test workflow)
      - name: Test
        run: dotnet test ReadyCode.Tests/ReadyCode.Tests.csproj -c Debug --no-restore

      # Publish (not build) so ReadyToRun precompilation is applied - the installers package the
      # publish output.
      - name: Publish app
        run: |
          dotnet publish ReadyCode/ReadyCode.csproj -c Release -r win-x64 --no-restore
          dotnet publish ReadyCode/ReadyCode.csproj -c Release -r win-arm64 --no-restore

      - name: Build installers
        run: |
          dotnet build ReadyCode.Installer/ReadyCode.Installer.wixproj -c Release -p:Platform=x64 --no-restore
          dotnet build ReadyCode.Installer/ReadyCode.Installer.wixproj -c Release -p:Platform=ARM64 --no-restore

      - name: Read Changelog
        id: changelog
        shell: pwsh
        run: |
          $content = Get-Content -Path "./CHANGELOG.md" -Raw

          # Extract text between the first ## heading and the second ## heading
          $match = [regex]::Match($content, '(?s)(## \[.*?)(?=\n## \[|\z)')
          $section = $match.Groups[1].Value.Trim()

          "CHANGELOG<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $section | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ReadyCode.Installer/bin/*/Release/en-US/*.msi
          body: ${{ steps.changelog.outputs.CHANGELOG }}